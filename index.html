<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click the Box</title>

<style>
  body {
    background: #1f1f1f;
    color: #ffffff;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  canvas {
    background: #0f0f0f;
    border: 3px solid #ffffff;
    display: block;
    margin: 20px auto;
  }

  button {
    padding: 10px 18px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
    border: none;
  }

  input {
    padding: 8px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
  }

  #menu {
    margin-top: 60px;
  }

  #gameUI {
    display: none;
  }

  #leaderboard {
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>Click the Box</h1>

<!-- START SCREEN -->
<div id="menu">
  <p>Enter your name:</p>
  <input id="nameInput" placeholder="Your name">
  <br><br>
  <button onclick="startGame()">Start Game</button>
</div>

<!-- GAME SCREEN -->
<div id="gameUI">
  <canvas id="gameCanvas" width="500" height="400"></canvas>

  <p id="score">Score: 0</p>
  <p id="timer">Time: 30</p>

  <button onclick="restartGame()">Restart</button>

  <div id="leaderboard">
    <h3>🏆 Leaderboard</h3>
    <ol id="leaderboardList"></ol>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let playerName = "Player";
  let score = 0;
  let timeLeft = 30;
  let gameOver = false;

  let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];

  const box = {
    x: 100,
    y: 100,
    size: 40,
    color: "#4dabf7"
  };

  let timerInterval;

  function randomColor() {
    const colors = ["#4dabf7", "#51cf66", "#ffd43b", "#ff6b6b", "#845ef7"];
    box.color = colors[Math.floor(Math.random() * colors.length)];
  }

  function randomSize() {
    const sizes = [25, 35, 45, 60];
    box.size = sizes[Math.floor(Math.random() * sizes.length)];
  }

  function moveBox() {
    box.x = Math.random() * (canvas.width - box.size);
    box.y = Math.random() * (canvas.height - box.size);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
      ctx.fillStyle = box.color;
      ctx.beginPath();
      ctx.roundRect(box.x, box.y, box.size, box.size, 8);
      ctx.fill();
    } else {
      ctx.fillStyle = "white";
      ctx.font = "32px Arial";
      ctx.fillText("TIME UP!", 160, 200);
    }
  }

  canvas.addEventListener("click", function (e) {
    if (gameOver) return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (
      mx >= box.x && mx <= box.x + box.size &&
      my >= box.y && my <= box.y + box.size
    ) {
      score++;
      document.getElementById("score").textContent = "Score: " + score;

      randomColor();
      randomSize();
      moveBox();
    } else {
      score = Math.max(0, score - 1);
      document.getElementById("score").textContent = "Score: " + score;
    }
  });

  function startTimer() {
    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        document.getElementById("timer").textContent = "Time: " + timeLeft;
      } else {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    gameOver = true;
    clearInterval(timerInterval);

    leaderboard.push({ name: playerName, score: score });
    leaderboard.sort((a, b) => b.score - a.score);
    leaderboard = leaderboard.slice(0, 5);

    localStorage.setItem("leaderboard", JSON.stringify(leaderboard));
    updateLeaderboard();
  }

  function updateLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";

    leaderboard.forEach(entry => {
      const li = document.createElement("li");
      li.textContent = entry.name + " - " + entry.score;
      list.appendChild(li);
    });
  }

  function gameLoop() {
    draw();
    requestAnimationFrame(gameLoop);
  }

  function startGame() {
    playerName = document.getElementById("nameInput").value || "Player";

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameUI").style.display = "block";

    restartGame();
    gameLoop();
  }

  function restartGame() {
    score = 0;
    timeLeft = 30;
    gameOver = false;

    document.getElementById("score").textContent = "Score: 0";
    document.getElementById("timer").textContent = "Time: 30";

    randomColor();
    randomSize();
    moveBox();

    clearInterval(timerInterval);
    startTimer();
    updateLeaderboard();
  }
</script>

</body>
</html>
