<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click the Box</title>

<style>
  body {
    background: #222;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  canvas {
    background: #111;
    border: 3px solid white;
    display: block;
    margin: 20px auto;
    cursor: pointer;
  }

  button {
    padding: 10px 18px;
    font-size: 16px;
    cursor: pointer;
    margin: 6px;
  }

  input {
    padding: 6px;
    font-size: 16px;
    margin-bottom: 10px;
  }

  #leaderboard {
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>Click the Box!</h1>

<!-- START MENU -->
<div id="menu">
  <p>Enter your name:</p>
  <input id="nameInput" placeholder="Your name">

  <p>Select difficulty:</p>
  <button onclick="startGame('normal')">Normal</button>
  <button onclick="startGame('hard')">Hard</button>
</div>

<!-- GAME UI -->
<div id="gameUI" style="display:none;">
  <canvas id="gameCanvas" width="500" height="400"></canvas>

  <p id="score">Score: 0</p>
  <p id="timer">Time: 30</p>

  <button onclick="restartGame()">Restart</button>
  <button onclick="backToMenu()">Back to Start</button>

  <div id="leaderboard">
    <h2>🏆 Leaderboard</h2>
    <ol id="leaderboardList"></ol>
  </div>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let playerName = "Player";
  let difficulty = "normal";

  let score = 0;
  let timeLeft = 30;
  let gameOver = false;

  let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];

  const box = {
    x: 100,
    y: 100,
    size: 40,
    color: "dodgerblue",
    dx: 3,
    dy: 3
  };

  let timerInterval;

  function randomColor() {
    const colors = [
      "#ff5252", "#ff9800", "#ffeb3b",
      "#4caf50", "#00bcd4", "#2196f3",
      "#9c27b0", "#e91e63"
    ];
    box.color = colors[Math.floor(Math.random() * colors.length)];
  }

  function randomSize() {
    const sizes = [20, 30, 40, 55, 70];
    box.size = sizes[Math.floor(Math.random() * sizes.length)];
  }

  function moveBoxRandom() {
    box.x = Math.random() * (canvas.width - box.size);
    box.y = Math.random() * (canvas.height - box.size);
  }

  function moveBoxHard() {
    box.x += box.dx;
    box.y += box.dy;

    if (box.x <= 0 || box.x + box.size >= canvas.width) box.dx *= -1;
    if (box.y <= 0 || box.y + box.size >= canvas.height) box.dy *= -1;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
      ctx.fillStyle = box.color;
      ctx.fillRect(box.x, box.y, box.size, box.size);
    } else {
      ctx.fillStyle = "white";
      ctx.font = "32px Arial";
      ctx.fillText("TIME UP!", 160, 200);
    }
  }

  canvas.addEventListener("click", function (e) {
    if (gameOver) return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (
      mx >= box.x && mx <= box.x + box.size &&
      my >= box.y && my <= box.y + box.size
    ) {
      score++;
      document.getElementById("score").textContent = "Score: " + score;

      randomColor();

      if (difficulty === "normal") {
        randomSize();
        moveBoxRandom();
      }
    } else {
      score = Math.max(0, score - 1);
      document.getElementById("score").textContent = "Score: " + score;
    }
  });

  function startTimer() {
    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        document.getElementById("timer").textContent = "Time: " + timeLeft;
      } else {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    gameOver = true;
    clearInterval(timerInterval);

    leaderboard.push({ name: playerName, score: score });
    leaderboard.sort((a, b) => b.score - a.score);
    leaderboard = leaderboard.slice(0, 5);

    localStorage.setItem("leaderboard", JSON.stringify(leaderboard));
    updateLeaderboard();
  }

  function updateLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";
    leaderboard.forEach(entry => {
      const li = document.createElement("li");
      li.textContent = entry.name + " - " + entry.score;
      list.appendChild(li);
    });
  }

  function gameLoop() {
    if (!gameOver && difficulty === "hard") {
      moveBoxHard();
    }
    draw();
    requestAnimationFrame(gameLoop);
  }

  function startGame(mode) {
    difficulty = mode;
    playerName = document.getElementById("nameInput").value || "Player";

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameUI").style.display = "block";

    restartGame();
    gameLoop();
  }

  function restartGame() {
    score = 0;
    timeLeft = 30;
    gameOver = false;

    document.getElementById("score").textContent = "Score: 0";
    document.getElementById("timer").textContent = "Time: 30";

    randomColor();

    if (difficulty === "normal") {
      randomSize();
      moveBoxRandom();
    } else {
      box.size = 35;
      box.dx = 3;
      box.dy = 3;
    }

    clearInterval(timerInterval);
    startTimer();
    updateLeaderboard();
  }

  function backToMenu() {
    gameOver = true;
    clearInterval(timerInterval);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    document.getElementById("gameUI").style.display = "none";
    document.getElementById("menu").style.display = "block";
  }
</script>

</body>
</html>
