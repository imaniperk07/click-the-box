<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click the Box</title>

<style>
  body {
    background: #222;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  canvas {
    background: #111;
    border: 3px solid white;
    display: block;
    margin: 20px auto;
    cursor: pointer;
  }

  button {
    margin-top: 10px;
    padding: 8px 16px;
    font-size: 16px;
    cursor: pointer;
  }

  #leaderboard {
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>Click the Box!</h1>
<p>Click the box as many times as you can in 30 seconds.</p>

<canvas id="gameCanvas" width="500" height="400"></canvas>

<p id="score">Score: 0</p>
<p id="timer">Time: 30</p>

<button id="restartBtn">Restart</button>

<div id="leaderboard">
  <h2>🏆 Leaderboard</h2>
  <ol id="leaderboardList"></ol>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // Ask for player name
  let playerName = prompt("Enter your name:") || "Player";

  let score = 0;
  let timeLeft = 30;
  let gameOver = false;

  let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];

  const box = {
    x: 100,
    y: 100,
    size: 40,
    color: "dodgerblue"
  };

  let timerInterval;

  function randomColor() {
    const colors = [
      "#ff5252", "#ff9800", "#ffeb3b",
      "#4caf50", "#00bcd4", "#2196f3",
      "#9c27b0", "#e91e63"
    ];
    box.color = colors[Math.floor(Math.random() * colors.length)];
  }

  function randomSize() {
    const sizes = [20, 30, 40, 55, 70];
    box.size = sizes[Math.floor(Math.random() * sizes.length)];
  }

  function moveBox() {
    box.x = Math.floor(Math.random() * (canvas.width - box.size));
    box.y = Math.floor(Math.random() * (canvas.height - box.size));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
      ctx.fillStyle = box.color;
      ctx.fillRect(box.x, box.y, box.size, box.size);
    } else {
      ctx.fillStyle = "white";
      ctx.font = "32px Arial";
      ctx.fillText("TIME UP!", 160, 200);
    }
  }

  canvas.addEventListener("click", function (event) {
    if (gameOver) return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = event.clientX - rect.left;
    const mouseY = event.clientY - rect.top;

    if (
      mouseX >= box.x &&
      mouseX <= box.x + box.size &&
      mouseY >= box.y &&
      mouseY <= box.y + box.size
    ) {
      score++;
      document.getElementById("score").textContent = "Score: " + score;

      randomColor();
      randomSize();
      moveBox();
    } else {
      score = Math.max(0, score - 1);
      document.getElementById("score").textContent = "Score: " + score;
    }
  });

  function endGame() {
    gameOver = true;
    clearInterval(timerInterval);

    leaderboard.push({ name: playerName, score: score });
    leaderboard.sort((a, b) => b.score - a.score);
    leaderboard = leaderboard.slice(0, 5);

    localStorage.setItem("leaderboard", JSON.stringify(leaderboard));
    updateLeaderboard();
  }

  function startTimer() {
    timerInterval = setInterval(function () {
      if (timeLeft > 0) {
        timeLeft--;
        document.getElementById("timer").textContent = "Time: " + timeLeft;
      } else {
        endGame();
      }
    }, 1000);
  }

  function updateLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";

    leaderboard.forEach(entry => {
      const li = document.createElement("li");
      li.textContent = entry.name + " - " + entry.score;
      list.appendChild(li);
    });
  }

  document.getElementById("restartBtn").addEventListener("click", function () {
    score = 0;
    timeLeft = 30;
    gameOver = false;

    document.getElementById("score").textContent = "Score: 0";
    document.getElementById("timer").textContent = "Time: 30";

    randomColor();
    randomSize();
    moveBox();

    clearInterval(timerInterval);
    startTimer();
  });

  function gameLoop() {
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Start game
  randomColor();
  randomSize();
  moveBox();
  updateLeaderboard();
  startTimer();
  gameLoop();
</script>

</body>
</html>
